services:
  db:
    image: naveen352/vibely-db:1.0
    container_name: vibely-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vibely_user
      - POSTGRES_PASSWORD=vibely_pass
      - POSTGRES_DB=vibely_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibely_user -d vibely_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Security: read-only root filesystem where possible
    tmpfs:
      - /tmp
      - /run

  backend:
    image: naveen352/vibely-backend:1.0
    container_name: vibely-backend
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=vibely_user
      - DB_PASSWORD=vibely_pass
      - DB_NAME=vibely_db
      - PORT=5000
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  frontend:
    image: naveen352/vibely-frontend:1.0
    container_name: vibely-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  db_data:
    driver: local