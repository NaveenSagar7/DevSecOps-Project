# ==============================================================
# vibely Blog Platform - Kubernetes Manifest (Single File)
# Includes: Namespace, Secrets, PVC (EBS), DB, Backend, Frontend
# ==============================================================

# ---- Namespace ----
apiVersion: v1
kind: Namespace
metadata:
  name: vibely
  labels:
    app.kubernetes.io/part-of: vibely

---
# ---- Database Secret ----
# In production, use External Secrets Operator or Sealed Secrets.
# This is base64 encoded for demo purposes.
# echo -n 'vibely_user' | base64 → dmliZWx5X3VzZXI==
# echo -n 'vibely_pass' | base64 → dmliZWx5X3Bhc3M=
# echo -n 'vibely_db' | base64 → dmliZWx5X2Ri

apiVersion: v1
kind: Secret
metadata:
  name: vibely-db-secret
  namespace: vibely
  labels:
    app.kubernetes.io/part-of: vibely
type: Opaque
data:
  POSTGRES_USER: dmliZWx5X3VzZXI=
  POSTGRES_PASSWORD: dmliZWx5X3Bhc3M=
  POSTGRES_DB: dmliZWx5X2Ri

---
