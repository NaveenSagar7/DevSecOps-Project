---

# ---- NetworkPolicy: DB only accepts traffic from Backend ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vibely-db-allow-backend-only
  namespace: vibely
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vibely-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vibely-backend
      ports:
        - port: 5432
          protocol: TCP

---
# ---- NetworkPolicy: Backend accepts traffic from Frontend only ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vibely-backend-allow-frontend-only
  namespace: vibely
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vibely-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vibely-frontend
      ports:
        - port: 5000
          protocol: TCP
          
